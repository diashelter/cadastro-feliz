# Toda requisição vai para o Laravel: a API não serve arquivos estáticos.
server {
    listen 80;
    server_name _;

    # O nome é resolvido a cada requisição, pelo DNS do Docker: recriar o php-fpm muda o
    # endereço dele, e com o nome fixo o nginx continuaria no endereço antigo, com 502.
    resolver 127.0.0.11 valid=5s;
    set $php_fpm php-fpm:9000;

    location / {
        include fastcgi_params;
        fastcgi_pass $php_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }
}
