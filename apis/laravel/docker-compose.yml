# Stack Laravel. Referência: docs/stacks.md › Laravel e .design/laravel-api-base.md.
# Use o Makefile: ele sobe os serviços comuns e aplica o migrate antes desta stack.
name: cadastro-feliz-laravel

x-php-build: &php-build
  context: .
  dockerfile: docker/php/Dockerfile
  # Sem a atestação de proveniência, que leva a data do build: um build sem
  # mudanças gera a mesma imagem, e o container não é recriado à toa.
  provenance: false

# As variáveis da stack ficam em apis/laravel/.env, criado a partir de .env.example. O arquivo
# entra na imagem e o Laravel o lê, como num projeto comum (decisão 31); aqui ficam só as
# variáveis próprias de um container.

services:
  php-fpm:
    build:
      <<: *php-build
      target: app
    image: cadastro-feliz-laravel-php-fpm
    # O limite de 1 s da conexão não cobre a resolução de nomes: sem isto, o nome de um
    # container parado segura a requisição por 5 s quando o DNS externo não responde.
    dns_opt: ["timeout:1", "attempts:1"]
    environment:
      # POST /users não toca na fila; só o painel do Horizon a lê, e desiste em 1 s.
      REDIS_TIMEOUT: "1"
      REDIS_READ_TIMEOUT: "1"
      REDIS_MAX_RETRIES: "0"
    healthcheck:
      # Só a página de ping do FPM: ordena a subida do nginx, que prova o caminho inteiro.
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s
    develop:
      watch:
        - action: sync
          path: ./app
          target: /var/www/html/app
        - action: sync
          path: ./app-modules
          target: /var/www/html/app-modules
        - action: sync
          path: ./bootstrap
          target: /var/www/html/bootstrap
          ignore:
            - cache/
        - action: sync
          path: ./config
          target: /var/www/html/config
        - action: sync
          path: ./routes
          target: /var/www/html/routes
        - action: sync
          path: ./tests
          target: /var/www/html/tests
        - action: rebuild
          path: ./composer.json
        - action: rebuild
          path: ./composer.lock
        - action: rebuild
          path: ./docker/php
        # O .env entra na imagem: uma edição nele só vale depois do rebuild.
        - action: rebuild
          path: ./.env

  # O worker: a mesma imagem do php-fpm, consumindo a fila registration-emails. Sem build
  # próprio: o Compose grava o nome do serviço na imagem, e dois builds da mesma tag a
  # fariam alternar de ID, recriando os containers a cada subida.
  horizon:
    image: cadastro-feliz-laravel-php-fpm
    command: ["php", "artisan", "horizon"]
    depends_on:
      redis:
        condition: service_healthy
      # O rebuild do watch recria todo serviço com esta imagem, mas só inicia o php-fpm e o
      # que depende dele: sem isto, o horizon ficaria parado em Created.
      php-fpm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s
    develop:
      watch:
        # Um worker de longa duração não recarrega o código: cada edição o reinicia.
        - action: sync+restart
          path: ./app
          target: /var/www/html/app
        - action: sync+restart
          path: ./app-modules
          target: /var/www/html/app-modules
        - action: sync+restart
          path: ./config
          target: /var/www/html/config

  # O relay: dispara outbox:relay a cada segundo. A mesma imagem do php-fpm, sem build próprio.
  # O schedule:work só dispara na virada do minuto: o schedule:run inicial cobre esse intervalo,
  # para um container novo não ficar até 60 s sem publicar. Cada execução é um processo novo,
  # então o watch só copia o código. O init repassa o sinal de parada, que o PHP ignoraria como PID 1,
  # ao grupo inteiro de processos: parado, o schedule:work espera o schedule:run em curso, que com a
  # tarefa de cada segundo só acaba na virada do minuto, e o docker stop levaria os 10 s até o SIGKILL.
  scheduler:
    image: cadastro-feliz-laravel-php-fpm
    command: ["sh", "-c", "php artisan schedule:run & exec php artisan schedule:work"]
    init: true
    dns_opt: ["timeout:1", "attempts:1"]
    environment:
      TINI_KILL_PROCESS_GROUP: "1"
      # A publicação desiste em 1 s, sem retentar: uma fila travada não segura o lote aberto.
      REDIS_TIMEOUT: "1"
      REDIS_READ_TIMEOUT: "1"
      REDIS_MAX_RETRIES: "0"
    depends_on:
      redis:
        condition: service_healthy
      # Como no horizon: sem isto, o rebuild do watch o deixaria parado em Created.
      php-fpm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php artisan schedule:list | grep -q outbox:relay"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s
    develop:
      watch:
        - action: sync
          path: ./app
          target: /var/www/html/app
        - action: sync
          path: ./app-modules
          target: /var/www/html/app-modules
        - action: sync
          path: ./config
          target: /var/www/html/config
        - action: sync
          path: ./routes
          target: /var/www/html/routes

  # Só a fila, separada do redis-limiter (decisão 5). Sem persistência: a fila é descartada com
  # a stack, e o outbox republica o que se perdeu.
  redis:
    image: redis:8.10.3-alpine
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --appendonly
      - "no"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s

  nginx:
    image: nginx:1.30.6-alpine
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php-fpm:
        condition: service_healthy
    healthcheck:
      # Saudável é o Laravel responder /health, com 200 ou 503: uma dependência fora
      # do ar aparece no corpo, não como uma stack que não sobe.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1/health 2>&1 | grep -qE 'HTTP/[0-9.]+ (200|503)'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

  # Execução única, por `make laravel-composer`: roda o composer sobre uma cópia de
  # apis/laravel e devolve só composer.json e composer.lock.
  composer:
    profiles: ["tools"]
    build:
      <<: *php-build
      target: base
    image: cadastro-feliz-laravel-php-base
    volumes:
      - ./:/src

networks:
  default:
    name: cadastro-feliz-net
    external: true
