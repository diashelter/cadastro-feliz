# Stack Laravel. Referência: docs/stacks.md › Laravel e .design/laravel-api-base.md.
# Use o Makefile: ele sobe os serviços comuns e aplica o migrate antes desta stack.
name: cadastro-feliz-laravel

x-php-build: &php-build
  context: .
  dockerfile: docker/php/Dockerfile
  # Sem a atestação de proveniência, que leva a data do build: um build sem
  # mudanças gera a mesma imagem, e o container não é recriado à toa.
  provenance: false

# As variáveis de que o php-fpm e o horizon precisam, do .env da raiz.
x-app-env: &app-env
  APP_KEY: ${APP_KEY}
  APP_ENV: ${APP_ENV}
  APP_DEBUG: ${APP_DEBUG}
  CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  LIMITER_REDIS_HOST: ${LIMITER_REDIS_HOST}
  LIMITER_REDIS_PORT: ${LIMITER_REDIS_PORT}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  MAIL_FROM: ${MAIL_FROM}
  REGISTRATION_MAX_ATTEMPTS: ${REGISTRATION_MAX_ATTEMPTS}
  REGISTRATION_ATTEMPT_WINDOW_SECONDS: ${REGISTRATION_ATTEMPT_WINDOW_SECONDS}
  REGISTRATION_MAX_PER_IP: ${REGISTRATION_MAX_PER_IP}
  REGISTRATION_IP_WINDOW_SECONDS: ${REGISTRATION_IP_WINDOW_SECONDS}
  OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS}
  OUTBOX_BACKOFF_BASE_SECONDS: ${OUTBOX_BACKOFF_BASE_SECONDS}

services:
  php-fpm:
    build:
      <<: *php-build
      target: app
    image: cadastro-feliz-laravel-php-fpm
    # O limite de 1 s da conexão não cobre a resolução de nomes: sem isto, o nome de um
    # container parado segura a requisição por 5 s quando o DNS externo não responde.
    dns_opt: ["timeout:1", "attempts:1"]
    environment:
      <<: *app-env
      # A publicação na fila desiste em 1 s, sem retentar: o 201 não espera o Redis.
      REDIS_TIMEOUT: "1"
      REDIS_READ_TIMEOUT: "1"
      REDIS_MAX_RETRIES: "0"
    healthcheck:
      # Só a página de ping do FPM: ordena a subida do nginx, que prova o caminho inteiro.
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s
    develop:
      watch:
        - action: sync
          path: ./app
          target: /var/www/html/app
        - action: sync
          path: ./app-modules
          target: /var/www/html/app-modules
        - action: sync
          path: ./bootstrap
          target: /var/www/html/bootstrap
          ignore:
            - cache/
        - action: sync
          path: ./config
          target: /var/www/html/config
        - action: sync
          path: ./routes
          target: /var/www/html/routes
        - action: sync
          path: ./tests
          target: /var/www/html/tests
        - action: rebuild
          path: ./composer.json
        - action: rebuild
          path: ./composer.lock
        - action: rebuild
          path: ./docker/php

  # O worker: a mesma imagem do php-fpm, consumindo a fila registration-emails.
  horizon:
    image: cadastro-feliz-laravel-php-fpm
    build:
      <<: *php-build
      target: app
    command: ["php", "artisan", "horizon"]
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s
    develop:
      watch:
        # Um worker de longa duração não recarrega o código: cada edição o reinicia.
        - action: sync+restart
          path: ./app
          target: /var/www/html/app
        - action: sync+restart
          path: ./app-modules
          target: /var/www/html/app-modules
        - action: sync+restart
          path: ./config
          target: /var/www/html/config
        - action: rebuild
          path: ./composer.json
        - action: rebuild
          path: ./composer.lock
        - action: rebuild
          path: ./docker/php

  # Só a fila, separada do redis-limiter (decisão 5). Sem persistência: a fila é descartada
  # com a stack, e essa perda é uma das limitações em estudo (decisão 21).
  redis:
    image: redis:8.10.3-alpine
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --appendonly
      - "no"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s

  nginx:
    image: nginx:1.30.6-alpine
    ports:
      - "${API_PORT}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php-fpm:
        condition: service_healthy
    healthcheck:
      # Saudável é o Laravel responder /health, com 200 ou 503: uma dependência fora
      # do ar aparece no corpo, não como uma stack que não sobe.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1/health 2>&1 | grep -qE 'HTTP/[0-9.]+ (200|503)'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

  # Execução única, por `make laravel-composer`: roda o composer sobre uma cópia de
  # apis/laravel e devolve só composer.json e composer.lock.
  composer:
    profiles: ["tools"]
    build:
      <<: *php-build
      target: base
    image: cadastro-feliz-laravel-php-base
    volumes:
      - ./:/src

networks:
  default:
    name: cadastro-feliz-net
    external: true
