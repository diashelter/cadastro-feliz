# Testes do projeto no GitHub Actions. Referência: docs/infrastructure.md › Integração contínua.
#
# Os jobs chamam os mesmos comandos de quem desenvolve: `make test-frontend`, `make test-laravel`
# e `make test-nest`. Só os testes da aplicação rodam aqui; a infraestrutura não tem testes
# (decisão 30).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O runner traz um Compose anterior ao 2.39, que recusa `build.provenance` do
# docker-compose.yml. Instala uma versão fixada, conferida pelo checksum publicado.
env:
  COMPOSE_VERSION: v2.40.3
  COMPOSE_SHA256: dba9d98e1ba5bfe11d88c99b9bd32fc4a0624a30fafe68eea34d61a3e42fd372

jobs:
  frontend:
    name: Frontend (tipos e testes)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Instala o Docker Compose
        run: |
          dir="$HOME/.docker/cli-plugins"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/docker-compose" \
            "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-x86_64"
          echo "$COMPOSE_SHA256  $dir/docker-compose" | sha256sum --check --strict -
          chmod +x "$dir/docker-compose"
          docker version --format '{{.Server.Version}}'
          docker compose version

      - name: make test-frontend
        run: make test-frontend

  laravel:
    name: Laravel (testes)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Instala o Docker Compose
        run: |
          dir="$HOME/.docker/cli-plugins"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/docker-compose" \
            "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-x86_64"
          echo "$COMPOSE_SHA256  $dir/docker-compose" | sha256sum --check --strict -
          chmod +x "$dir/docker-compose"
          docker version --format '{{.Server.Version}}'
          docker compose version

      - name: make test-laravel
        run: make test-laravel

  nest:
    name: NestJS (tipos e testes)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Instala o Docker Compose
        run: |
          dir="$HOME/.docker/cli-plugins"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/docker-compose" \
            "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-x86_64"
          echo "$COMPOSE_SHA256  $dir/docker-compose" | sha256sum --check --strict -
          chmod +x "$dir/docker-compose"
          docker version --format '{{.Server.Version}}'
          docker compose version

      - name: make test-nest
        run: make test-nest
