# Serviços comuns às três stacks. Referência: docs/infrastructure.md.
# Use o Makefile: ele cria a rede externa e ordena este projeto, o migrate e a stack.
name: cadastro-feliz-shared

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # A partir do PostgreSQL 18 a imagem declara o volume em /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Pelo TCP: durante a inicialização o servidor temporário só escuta no socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  redis-limiter:
    image: redis:8.10.3-alpine
    # Só guarda o contador de tentativas: descartável, sem persistência.
    command:
      - redis-server
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - volatile-ttl
      - --save
      - ""
      - --appendonly
      - "no"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
      start_interval: 1s

  frontend:
    # `next dev` com o código copiado na imagem. Referência: .design/frontend-container.md.
    # Sem bind mount: no Docker Desktop do macOS os eventos de arquivo não chegam com
    # confiança ao Turbopack. `make watch-frontend` sincroniza as edições.
    build:
      context: ./frontend
      # Sem a atestação de proveniência, que leva a data do build: um build sem
      # mudanças gera a mesma imagem, e o container não é recriado à toa.
      provenance: false
    image: cadastro-feliz-shared-frontend
    environment:
      # Lido quando o container inicia; trocar o valor no .env não exige rebuild.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    healthcheck:
      # Saudável é responder HTTP, com qualquer status: um erro de compilação
      # aparece no navegador e não derruba o serviço.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(() => process.exit(0), () => process.exit(1))"]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 120s
      start_interval: 2s
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/next.config.ts

  migrate:
    image: migrate/migrate:v4.20.1
    # Execução única, por `make migrate`: fora do `up` dos serviços de longa duração.
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_DATABASE}?sslmode=disable
      - up

volumes:
  postgres-data:

networks:
  default:
    name: cadastro-feliz-net
    external: true
